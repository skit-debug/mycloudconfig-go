version: "2"

linters:
  default: standard

  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - nilerr
    - prealloc
    - staticcheck
    - unconvert
    - unused

  settings:
    gocyclo:
      min-complexity: 15

    govet:
      enable:
        - shadow

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$